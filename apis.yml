  - aid: university-of-alberta:datacite-registration
    name: University of Alberta Library DOI Registration (DataCite)
    x-operator: tenant
    description: >-
      The University of Alberta Library is a registered DataCite repository — client id
      ualberta.library, symbol UALBERTA.LIBRARY, a member since 2020 — with 90,338 DOIs
      registered under that client as of 2026-08-30. Its own DataCite record documents that in
      March 2025 the library shared its credentials with Scholaris for ERA and dropped the
      shoulder it had used for Jupiter, which is the same migration the repository entry above
      records. The registrations are the institution's; the registry API is DataCite's.
    humanURL: https://api.datacite.org/repositories/ualberta.library
    baseURL: https://api.datacite.org
    tags:
      - DataCite
      - DOI
      - Persistent Identifiers
      - Research Data
    properties:
