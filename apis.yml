  - aid: university-of-alberta:library-catalogue
    name: University of Alberta Library Catalogue (Alma Z39.50 + Primo VE)
    x-operator: tenant
    description: >-
      The library's discovery and catalogue layer is Ex Libris. The library publishes its own
      Z39.50 production server details on a ualberta.ca page — host
      ualberta.alma.exlibrisgroup.com, port 1921, database 01UOA_INST — and states support for
      the Bath Profile v1.1 functional area A levels 0 and 1, enumerating the bib-1 attribute
      combinations. The public discovery front end is Primo VE at search.library.ualberta.ca
      (view 01UOA_INST:UOA_NDE), on the university's own subdomain but running the vendor's
      application. Documented by the institution, operated by Ex Libris.
    humanURL: https://www.ualberta.ca/en/library/research-support/open-data/z3950.html
    baseURL: z3950://ualberta.alma.exlibrisgroup.com:1921/01UOA_INST
    tags:
