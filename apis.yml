aid: university-of-alberta
name: University of Alberta
x-type: university
x-category: Public Research University
description: >-
  The University of Alberta is a public research university in Edmonton, Alberta, Canada, and a
  member of the U15 Group of Canadian Research Universities. It operates no public API product.
  Its central developer site, api.ualberta.ca, is a live placeholder that says only that the
  university "is currently working to improve the way data is cataloged, shared, and governed"
  and gives an email address; there is no portal, no key issuance and no catalog behind it. The
  one machine-readable contract the institution itself publishes and runs is its SAML 2.0
  identity provider metadata at login.ualberta.ca, which is institution-operated by definition
  and is the only surface in this profile whose operator is the university. Everything else that
  looks like a University of Alberta API is a tenancy on someone else's platform: ERA, the
  institutional repository, migrated off the library's own Jupiter application at
  era.library.ualberta.ca onto Scholaris, the OCUL/Scholars Portal national DSpace service, and
  now answers as ualberta.scholaris.ca with a DSpace REST API and an OAI-PMH endpoint; research
  data lives in the university's collection on Borealis, the Canadian Dataverse Repository run
  by the same consortium; the library catalogue is Ex Libris Alma and Primo VE, whose Z39.50
  server the library documents in its own words; and its 90,338 DOIs are registered through
  DataCite. The course catalogue and Bear Tracks are HTML only — every JSON path probed on
  apps.ualberta.ca returns 404 or 410, which is why the third-party UAlberta course APIs that
  exist are HTML scrapers. The university's real engineering output is open source rather than
  hosted: the University of Alberta Library GitHub organization is active and substantial, and
  includes its own OAI-PMH implementation and DSpace and DataCite client tooling.
