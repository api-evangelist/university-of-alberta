apis:
  - aid: university-of-alberta:identity-federation
    name: University of Alberta SAML 2.0 Identity Provider Metadata
    x-operator: institution
    description: >-
      The university's own SAML 2.0 identity provider metadata document, served from its own
      domain. It declares entityID https://login.ualberta.ca/saml2/idp/metadata.php, an
      IDPSSODescriptor with SingleSignOn over HTTP-Redirect and HTTP-POST plus SingleLogout, the
      Shibboleth metadata extension shibmd:Scope of ualberta.ca, mdrpi:RegistrationInfo with
      registration authority urn:mace:ualberta.ca, and OrganizationName in English and French.
      This is the only contract in this profile the University of Alberta both writes and runs —
      identity federation is institution-operated by definition, and it is the surface class this
      cohort most consistently fails to catalog.
    humanURL: https://login.ualberta.ca/
    baseURL: https://login.ualberta.ca/saml2/idp/metadata.php
    tags:
      - Identity Federation
      - SAML
      - Shibboleth
      - Single Sign-On
    properties:
      - type: Documentation
        url: https://login.ualberta.ca/saml2/idp/metadata.php
      - type: Conformance
        url: conformance/university-of-alberta-conformance.yml
  - aid: university-of-alberta:era-scholaris
    name: ERA — Education and Research Archive (on Scholaris)
    x-operator: tenant
    description: >-
      ERA is the University of Alberta's institutional repository. It was the library's own
      Samvera/Hyrax application, Jupiter, at era.library.ualberta.ca; that host now redirects to
      ualberta.scholaris.ca, the university's tenancy on Scholaris, the national DSpace service
      operated by OCUL/Scholars Portal. The deployment answers as DSpace 8.4 with a HAL+JSON REST
      API at /server/api and an OAI-PMH 2.0 endpoint whose Identify response names ERA and gives
      erahelp@ualberta.ca as the administrative contact. The content, the service desk and the
      DOIs are the university's; the contract is DSpace's and the platform is the consortium's,
      so no DSpace specification is saved under this institution.
    humanURL: https://ualberta.scholaris.ca/
    baseURL: https://ualberta.scholaris.ca/server/api
    tags:
      - Research Repository
      - DSpace
      - OAI-PMH
      - Open Access
    properties:
      - type: Documentation
        url: https://ualberta.scholaris.ca/server/api
      - type: Conformance
        url: conformance/university-of-alberta-conformance.yml
  - aid: university-of-alberta:borealis-research-data
    name: University of Alberta Research Data Collection on Borealis
    x-operator: tenant
    description: >-
      The University of Alberta's research data collection on Borealis, the Canadian Dataverse
      Repository operated by Scholars Portal / Ontario Council of University Libraries. The
      collection is scoped by the dataverse alias "ualberta" and is reachable through the shared
      Dataverse Native and Search APIs and the shared OAI-PMH archive at borealisdata.ca/oai,
      whose Identify response names the consortium, not the university. Five other institutions
      in this cohort point at the same host, which is precisely why the generic Dataverse
      contract is not saved here: the data is the university's, the API is Borealis's.
    humanURL: https://borealisdata.ca/dataverse/ualberta
    baseURL: https://borealisdata.ca/api
    tags:
