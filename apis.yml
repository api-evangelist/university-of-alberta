        url: https://api.datacite.org/repositories/ualberta.library
      - type: Conformance
        url: conformance/university-of-alberta-conformance.yml
  - aid: university-of-alberta:library-open-source
    name: University of Alberta Library Open Source (GitHub)
    x-operator: institution
    description: >-
      The University of Alberta Library's GitHub organization, ualbertalib, holds 138 public
      repositories and is actively maintained. Judged by what the code says about itself rather
      than by the host it sits on, it is the institution's own engineering: oaisys implements
      OAI-PMH for the library's Jupiter repository, jupiter is the repository application itself,
      dspace_api_tools and datacite-client are its integration clients, and library-cms,
      NDE-Customization-Package and ual_ojs_stats run library services. This is source code and
      operational tooling, not a hosted public API, and it is the university's most substantial
      programmable output.
    humanURL: https://github.com/ualbertalib
    tags:
