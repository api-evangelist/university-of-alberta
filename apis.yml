x-coverage:
  state: none
  reason: tenant_only
  detail: >-
    Probed 2026-08-30. The University of Alberta publishes exactly one machine-readable contract
    it also operates: its SAML 2.0 identity provider metadata at login.ualberta.ca, which returns
    200 application/samlmetadata+xml. There is no institution-operated REST API. api.ualberta.ca
    returns 200 but the body is a placeholder saying the university is still working out how data
    is cataloged, shared and governed, and offers only an email address; data.ualberta.ca serves
    the same byte-identical page. Every other apparent surface is a tenancy: ERA on Scholaris
    (OCUL DSpace), the research data collection on Borealis (Canadian Dataverse, a host five
    other institutions in this cohort also claim), the Alma Z39.50 server and Primo VE discovery
    layer from Ex Libris, and DOI registration through DataCite. The course catalogue is HTML
    only — apps.ualberta.ca returns 404 for /api and 410 for every .json path tried, so the
    third-party UAlberta course APIs in the wild are scrapers. The library's Open Journal Systems
    installation is gone: journals.library.ualberta.ca now 302s to a library publishing page, so
    there is no Crossref depositing surface either. Twenty files were removed from this repository in this
    pass — two Borealis-derived OpenAPI documents, the pristine original and its refine report,
    and the sixteen collections, schemas, structures, examples, rulesets, vocabulary, JSON-LD
    context, authentication and agentic-access artifacts derived from them. They described the
    Dataverse software's contract, not the university's.
