description: >-
  University of Alberta is a non-commercial higher-education institution and sells no API
  product. It operates no public REST API of its own; the machine-readable surfaces its
  community uses are vendor-platform tenancies (Scholaris/DSpace, Borealis/Dataverse, Ex Libris
  Alma and Primo VE, DataCite) whose terms are the platform operator's, plus the university's
  own SAML 2.0 identity provider, which is free to federate with but is gated by federation
  membership rather than by a paid plan. There is no key issuance, no signup and no price
  anywhere on api.ualberta.ca, which is a placeholder page.
notes: >-
  No published per-seat or per-call commercial pricing. "Free / Open" reflects open
  public endpoints; "Affiliation / Credentialed" reflects access gated by institutional
  identity rather than payment.
