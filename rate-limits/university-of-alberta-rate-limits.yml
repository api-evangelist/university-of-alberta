description: >-
  University of Alberta publishes no rate-limit table, and has no institution-operated API to
  publish one for. The endpoints its community harvests belong to vendor platforms — the
  OAI-PMH and DSpace REST endpoints on ualberta.scholaris.ca, the Dataverse Native and Search
  APIs on borealisdata.ca, and the Ex Libris Alma Z39.50 server — and any throttling there is
  the platform operator's, not the university's. Harvest politely, honor Retry-After, and take
  bulk requests to the operating platform.
notes: Confirm per-service limits with each API's documentation; harvest responsibly.
